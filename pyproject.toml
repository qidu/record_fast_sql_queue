[project]
name = "model-proxy-recording-service"
version = "1.0.0"
description = "Remote recording service for model_proxy_v3 usage statistics"
authors = [{name = "DevBot", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "aiosqlite==0.19.0",
    "aiohttp==3.9.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/openai/codex"
"Bug Tracker" = "https://github.com/openai/codex/issues"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
